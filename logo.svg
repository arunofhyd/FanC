<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0088ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="21" ry="21" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="38" fill="url(#ambientGlow)"/>
  
  <!-- 4-Blade Turbine Fan -->
  <g filter="url(#glow)">
    <!-- Blade 1 (North) -->
    <path d="M 50 50 C 47 38, 41 24, 52 18 C 61 24, 56 38, 50 50 Z" fill="url(#cyanGrad)"/>
    <!-- Blade 2 (East) -->
    <path d="M 50 50 C 62 47, 76 41, 82 52 C 76 61, 62 56, 50 50 Z" fill="url(#cyanGrad)"/>
    <!-- Blade 3 (South) -->
    <path d="M 50 50 C 53 62, 59 76, 48 82 C 39 76, 44 62, 50 50 Z" fill="url(#cyanGrad)"/>
    <!-- Blade 4 (West) -->
    <path d="M 50 50 C 38 53, 24 59, 18 48 C 24 39, 38 44, 50 50 Z" fill="url(#cyanGrad)"/>
  </g>
  
  <!-- Center Cap -->
  <circle cx="50" cy="50" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="50" cy="50" r="3.5" fill="#00f2fe"/>
</svg>
