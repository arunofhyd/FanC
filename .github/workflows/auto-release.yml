name: Auto Release FanC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version and changelog
        id: version_info
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          python3 -c "
          import json
          data = json.load(open('version.json'))
          changes = data['changelog'][0]['changes']
          print('## What\'s New in v' + data['version'])
          for c in changes:
              print('- ' + c)
          " > release_notes.md

      - name: Check if Release Exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version_info.outputs.version }}" > /dev/null 2>&1; then
            echo "Release v${{ steps.version_info.outputs.version }} already exists. Skipping."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Build and Test
        if: env.skip == 'false'
        run: |
          swift test
          ./build_app.sh

      - name: Package Release App
        if: env.skip == 'false'
        run: |
          ditto -c -k --keepParent .build/release/FanC.app FanC.zip
          ls -lh FanC.zip

      - name: Create GitHub Release
        if: env.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version_info.outputs.version }}" FanC.zip \
            --title "FanC v${{ steps.version_info.outputs.version }}" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA"
